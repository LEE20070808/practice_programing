<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロブレム一覧 | CodeDrill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Code<strong>Drill</strong></div>
  </div>
  <div class="topbar-right">
    <span class="datetime" id="datetime"></span>
    <span class="streak">day_streak: <strong id="streakValue">--</strong></span>
    <div id="authArea" class="auth-area"></div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">navigation</div>
  <nav>
    <a href="index.html"><span class="prompt">$</span> home</a>
    <a href="problem-list.html" class="active"><span class="prompt">$</span> problem</a>
    <a href="history.html"><span class="prompt">$</span> history</a>
    <a href="settings.html"><span class="prompt">$</span> settings</a>
  </nav>
</aside>

<div class="page">
  <div class="container">
    <div class="page-heading">
      <h1>プロブレム一覧</h1>
      <p>取り組みたい問題を選んでください。</p>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">言語</span>
        <div class="filter-buttons" id="langFilter" data-filter-type="language">
          <button class="filter-btn active" data-value="all">すべて</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">難易度</span>
        <div class="filter-buttons" id="diffFilter" data-filter-type="difficulty">
          <button class="filter-btn active" data-value="all">すべて</button>
          <button class="filter-btn" data-value="初級">初級</button>
          <button class="filter-btn" data-value="中級">中級</button>
          <button class="filter-btn" data-value="上級">上級</button>
        </div>
      </div>
    </div>

    <div class="problem-grid" id="problemGrid">
      <!-- カードはJSで生成されます -->
    </div>
  </div>
</div>

<script src="problems-data.js"></script>
<script src="app.js"></script>
<script src="onboarding.js"></script>
<script src="auth.js"></script>
<script src="problem-list.js"></script>
</body>
</html>
