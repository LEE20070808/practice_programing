<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロブレム | CodeDrill</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Code<strong>Drill</strong></div>
  </div>
  <div class="topbar-right">
    <span class="datetime" id="datetime"></span>
    <span class="streak">day_streak: <strong id="streakValue">--</strong></span>
    <div id="authArea" class="auth-area"></div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">navigation</div>
  <nav>
    <a href="index.html"><span class="prompt">$</span> home</a>
    <a href="problem-list.html" class="active"><span class="prompt">$</span> problem</a>
    <a href="history.html"><span class="prompt">$</span> history</a>
    <a href="settings.html"><span class="prompt">$</span> settings</a>
    <a href="terms.html"><span class="prompt">$</span> terms</a>
    <a href="privacy.html"><span class="prompt">$</span> privacy</a>
  </nav>
</aside>

<div class="page">
  <div class="container">
    <a class="breadcrumb" href="problem-list.html">&larr; 問題一覧に戻る</a>

    <div class="problem-layout">
      <div class="panel" id="problemInfo">
        <!-- タグ・タイトル・説明・与えられたHTMLはJSで挿入されます -->
      </div>

      <div class="editor-preview">
        <div class="panel editor-panel">
          <p class="subheading" id="editorLabel">あなたのコード</p>
          <textarea id="jsInput" spellcheck="false"></textarea>
          <div class="editor-actions">
            <button class="run-btn" id="runBtn">実行する ▶</button>
            <span class="status-msg" id="statusMsg">実行しました</span>
          </div>
          <div class="test-result" id="testResult"></div>
        </div>

        <div class="panel preview-panel" id="previewPanel">
          <p class="subheading">プレビュー</p>
          <iframe id="previewFrame" title="プレビュー" sandbox="allow-scripts"></iframe>
        </div>

        <div class="panel io-panel" id="ioPanel" style="display:none;">
          <p class="subheading">テストケース結果</p>
          <div class="io-cases" id="ioCases"></div>
        </div>

        <div class="panel ai-review-panel">
          <p class="subheading">AIレビュー（プロンプト練習）</p>
          <p class="ai-review-desc">
            コードはChatGPTやClaudeに出させたものを貼って構いません。<br>
            ここでの本番は「次にAIへ出す指示」です。評価軸は1つだけ見て、弱点・指示の穴・改善例を返します。<br>
            テストに1つも通っていない状態ではレビューできません。
          </p>
          <label class="ai-field-label" for="reviewAxis">今回見る軸</label>
          <select id="reviewAxis" class="ai-axis-select">
            <option value="readable">読みやすさ</option>
            <option value="robust">壊れにくさ</option>
            <option value="specific">指示の具体性</option>
          </select>
          <label class="ai-field-label" for="userPromptInput">次にAIへ出す指示（空でも可）</label>
          <textarea id="userPromptInput" class="ai-prompt-input" rows="5" spellcheck="false" placeholder="例: JavaScriptで、入力が空のときは追加せず、liを作って#itemListに足し、入力欄を空にしてください。他の要素は触らないでください。"></textarea>
          <div class="editor-actions">
            <button class="ai-review-btn" id="aiReviewBtn" type="button" disabled>指示をレビューする</button>
            <span class="ai-review-gate" id="aiReviewGate">先にコードを実行し、テストを1つ以上通してください。</span>
          </div>
          <div class="ai-review-result" id="aiReviewResult"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js" defer></script>

<script src="problems-data.js"></script>
<script src="app.js"></script>
<script src="onboarding.js"></script>
<script src="auth.js"></script>
<script src="problem-detail.js"></script>
</body>
</html>
