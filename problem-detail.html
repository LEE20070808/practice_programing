<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロブレム | CodeDrill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Code<strong>Drill</strong></div>
  </div>
  <div class="topbar-right">
    <span class="datetime" id="datetime"></span>
    <span class="streak">day_streak: <strong>07</strong></span>
    <div class="avatar" title="ユーザー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
      </svg>
    </div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">navigation</div>
  <nav>
    <a href="index.html"><span class="prompt">$</span> home</a>
    <a href="problem-list.html" class="active"><span class="prompt">$</span> problem</a>
    <a href="#"><span class="prompt">$</span> history</a>
    <a href="#"><span class="prompt">$</span> settings</a>
  </nav>
</aside>

<div class="page">
  <div class="container">
    <a class="breadcrumb" href="problem-list.html">&larr; 問題一覧に戻る</a>

    <div class="problem-layout">
      <div class="panel" id="problemInfo">
        <!-- タグ・タイトル・説明・与えられたHTMLはJSで挿入されます -->
      </div>

      <div class="editor-preview">
        <div class="panel editor-panel">
          <p class="subheading">あなたのJavaScript</p>
          <textarea id="jsInput" spellcheck="false"></textarea>
          <div class="editor-actions">
            <button class="run-btn" id="runBtn">実行する ▶</button>
            <span class="status-msg" id="statusMsg">実行しました</span>
          </div>
        </div>

        <div class="panel preview-panel">
          <p class="subheading">プレビュー</p>
          <iframe id="previewFrame" title="プレビュー" sandbox="allow-scripts"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="problems-data.js"></script>
<script src="app.js"></script>
<script src="problem-detail.js"></script>
</body>
</html>
